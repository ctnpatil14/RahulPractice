name: 'First workflow'

#uses - prebuilt actions concurrency
#run - run command on shell.
#cache - whernever we cache anything GH keeps it on the local 

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name : checkout code 
          uses: actions/checkout@v4
        - name: install npm
          run: ./npm install 

          

          
    
    
      

    
